name: aits-ledger-lab

services:
  ledger-key:
    image: postgres:16-alpine
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        if [ ! -s /run/ledger/key ]; then
          umask 022
          od -An -v -tx1 -N32 /dev/urandom | tr -d ' \n' > /run/ledger/key.tmp
          mv /run/ledger/key.tmp /run/ledger/key
        fi
    volumes:
      - ledger_key:/run/ledger

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bastion
      POSTGRES_PASSWORD: bastion
      POSTGRES_DB: bastion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, bastion, -d, bastion]
      interval: 2s
      timeout: 2s
      retries: 30

  aits:
    build:
      context: ${AITS_SOURCE:-../../..}
    environment:
      DATABASE_URL: postgresql+psycopg://bastion:bastion@postgres:5432/bastion
      AUTH_DISABLED: 'false'
      CORS_ORIGINS: '["http://localhost:5678","http://localhost:5679","null"]'
    command:
      - /bin/sh
      - -ec
      - |
        export AUTH_SERVICE_KEYS="n8n-tutorial:$$(cat /run/ledger/key)"
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ledger_key:/run/ledger:ro
    ports:
      - '127.0.0.1:${AITS_HOST_PORT:-8001}:8000'
    depends_on:
      ledger-key:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30

  n8n:
    build:
      context: ${AITS_SOURCE:-../../..}
      dockerfile: docs/tutorials/n8n-ledger-lab/Dockerfile
    environment:
      N8N_SECURE_COOKIE: 'false'
      N8N_CUSTOM_EXTENSIONS: /opt/aits-nodes
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_HOST_PORT:-5679}
      WEBHOOK_URL: http://localhost:${N8N_HOST_PORT:-5679}/
      AITS_URL: http://aits:8000
      AITS_KEY_FILE: /run/ledger/key
      AITS_DASHBOARD_URL: http://localhost:${N8N_HOST_PORT:-5679}/webhook/ledger
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-granite4.2:3b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'true'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
    depends_on:
      aits:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${N8N_HOST_PORT:-5679}:5678'
    volumes:
      - n8n_data:/home/node/.n8n
      - ledger_key:/run/ledger:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

volumes:
  postgres_data:
  n8n_data:
  ledger_key:
